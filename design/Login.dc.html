<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap');
    :root{
      --bg: oklch(97% 0.014 75);
      --surface: oklch(99% 0.006 75);
      --border: oklch(90% 0.014 75);
      --text: oklch(27% 0.02 75);
      --text-soft: oklch(52% 0.018 75);
      --text-faint: oklch(65% 0.015 75);
      --accent: oklch(68% 0.1 42);
      --accent-ink: oklch(38% 0.1 42);
      --accent-soft: oklch(93% 0.035 42);
      --accent2: oklch(68% 0.08 160);
      --accent2-ink: oklch(38% 0.08 160);
      --accent2-soft: oklch(93% 0.03 160);
    }
    body{margin:0; font-family:'Work Sans', sans-serif; color:var(--text);}
    h1,h2,h3{font-family:'Quicksand', sans-serif; margin:0;}
    a{color:var(--accent);}
    a:hover{color:var(--accent-ink);}
  </style>
</helmet>
<div style="width:390px; height:844px; background:var(--bg); box-sizing:border-box; display:flex; flex-direction:column; align-items:stretch; justify-content:center; padding:36px; gap:34px;">

  <div style="display:flex; flex-direction:column; align-items:center; gap:14px;">
    <div style="width:64px; height:64px; border-radius:20px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; color:var(--accent-ink);">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.5-9C1.3 8.4 2.4 5 5.8 5c2 0 3.3 1.1 4 2.3.7-1.2 2-2.3 4-2.3 3.4 0 4.5 3.4 3.3 6.5-2 4.4-9.5 9-9.5 9z"/></svg>
    </div>
    <h1 style="font-size:24px; font-weight:700;">Nuestra Lista</h1>
    <p style="margin:0; font-size:14px; color:var(--text-soft); text-align:center;">La lista de deseos de la familia</p>
  </div>

  <div style="display:flex; flex-direction:column; gap:10px;">
    <span style="font-size:13px; font-weight:600; color:var(--text-soft);">¿Quién eres?</span>
    <div style="display:flex; gap:12px;">

      <div style="flex:1; position:relative; display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 8px; border-radius:18px; border:2px solid var(--accent); background:var(--accent-soft);">
        <div style="position:absolute; top:8px; right:8px; width:20px; height:20px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"/></svg>
        </div>
        <div style="width:48px; height:48px; border-radius:50%; background:var(--accent); color:white; display:flex; align-items:center; justify-content:center; font-family:'Quicksand', sans-serif; font-weight:700; font-size:18px;">A</div>
        <span style="font-size:14px; font-weight:600;">Andrés</span>
      </div>

      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 8px; border-radius:18px; border:2px solid var(--border); background:var(--surface);">
        <div style="width:48px; height:48px; border-radius:50%; background:var(--accent2-soft); color:var(--accent2-ink); display:flex; align-items:center; justify-content:center; font-family:'Quicksand', sans-serif; font-weight:700; font-size:18px;">A</div>
        <span style="font-size:14px; font-weight:600; color:var(--text-soft);">Ana</span>
      </div>

    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:8px;">
    <span style="font-size:13px; font-weight:600; color:var(--text-soft);">Contraseña</span>
    <div style="border:1px solid var(--border); background:var(--surface); border-radius:14px; padding:14px 16px; font-size:16px; letter-spacing:3px; color:var(--text-faint);">••••••••</div>
    <a href="#" style="align-self:flex-end; font-size:12px; font-weight:500; text-decoration:none;">¿Olvidaste tu contraseña?</a>
  </div>

  <button style="border:none; background:var(--accent); color:white; font-family:'Work Sans', sans-serif; font-size:16px; font-weight:600; padding:16px; border-radius:16px; cursor:pointer;">Entrar</button>

</div>
</x-dc>
</body>
</html>
