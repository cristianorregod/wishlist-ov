<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap');
    :root{
      --bg: oklch(97% 0.014 75);
      --surface: oklch(99% 0.006 75);
      --border: oklch(90% 0.014 75);
      --text: oklch(27% 0.02 75);
      --text-soft: oklch(52% 0.018 75);
      --text-faint: oklch(65% 0.015 75);
      --accent: oklch(68% 0.1 42);
      --accent-soft: oklch(93% 0.035 42);
      --accent2: oklch(68% 0.08 160);
      --accent2-ink: oklch(38% 0.08 160);
      --accent2-soft: oklch(93% 0.03 160);
      --lav-soft: oklch(93% 0.03 320);
      --lav-ink: oklch(45% 0.07 320);
      --sand-soft: oklch(93% 0.03 85);
      --sand-ink: oklch(45% 0.08 85);
      --pri-low-bg: oklch(93% 0.035 155);
      --pri-low-ink: oklch(40% 0.08 155);
      --pri-med-bg: oklch(93% 0.04 80);
      --pri-med-ink: oklch(42% 0.09 80);
      --pri-high-bg: oklch(92% 0.05 30);
      --pri-high-ink: oklch(42% 0.11 30);
    }
    body{margin:0; font-family:'Work Sans', sans-serif; color:var(--text);}
    h1,h2,h3{font-family:'Quicksand', sans-serif; margin:0;}
  </style>
</helmet>
<div style="width:390px; height:844px; background:var(--bg); box-sizing:border-box; position:relative; overflow:hidden;">

  <div style="padding:28px 20px 16px; display:flex; align-items:center; justify-content:space-between;">
    <div>
      <p style="margin:0 0 2px; font-size:13px; color:var(--text-soft);">Deseos de</p>
      <h1 style="font-size:24px; font-weight:700;">Ana</h1>
    </div>
    <div style="width:40px; height:40px; border-radius:50%; background:var(--accent2-soft); color:var(--accent2-ink); display:flex; align-items:center; justify-content:center; font-family:'Quicksand', sans-serif; font-weight:700; font-size:15px;">A</div>
  </div>

  <div style="padding:4px 20px; display:flex; flex-direction:column; gap:12px;">

    <div style="display:flex; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px;">
      <div style="width:56px; height:56px; flex:none; border-radius:14px; background:var(--accent-soft); color:oklch(45% 0.09 42); display:flex; align-items:center; justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 12.6L12.4 20.8a2 2 0 01-2.8 0l-6.4-6.4a2 2 0 010-2.8L11.4 3.2A2 2 0 0112.8 2.6L19 3l.4 6.2a2 2 0 01-.6 1.4z"/><circle cx="15.5" cy="8.5" r="1.4"/></svg>
      </div>
      <div style="flex:1; min-width:0;">
        <p style="margin:0 0 2px; font-size:15px; font-weight:600;">Bufanda tejida</p>
        <p style="margin:0 0 8px; font-size:12.5px; color:var(--text-soft);">Color mostaza</p>
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:13px; font-weight:600;">$60.000</span>
          <span style="font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px; background:var(--pri-high-bg); color:var(--pri-high-ink);">Alta</span>
        </div>
      </div>
      <div style="width:32px; height:32px; flex:none; border-radius:50%; border:1.8px solid var(--border); color:var(--text-faint); display:flex; align-items:center; justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"/></svg>
      </div>
    </div>

    <div style="display:flex; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; opacity:0.55;">
      <div style="width:56px; height:56px; flex:none; border-radius:14px; background:var(--lav-soft); color:var(--lav-ink); display:flex; align-items:center; justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4"/><path d="M4 12h16v9H4z"/><path d="M12 8v13"/><path d="M12 8H8a2.5 2.5 0 010-5C11 3 12 8 12 8z"/><path d="M12 8h4a2.5 2.5 0 000-5C9 3 12 8 12 8z"/></svg>
      </div>
      <div style="flex:1; min-width:0;">
        <p style="margin:0 0 2px; font-size:15px; font-weight:600;">Perfume floral</p>
        <p style="margin:0 0 8px; font-size:12.5px; color:var(--text-soft);">El que vimos en el centro comercial</p>
        <span style="font-size:12px; font-weight:600; color:var(--accent2-ink);">Cumplido</span>
      </div>
      <div style="width:32px; height:32px; flex:none; border-radius:50%; background:var(--accent2); display:flex; align-items:center; justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"/></svg>
      </div>
    </div>

    <div style="display:flex; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px;">
      <div style="width:56px; height:56px; flex:none; border-radius:14px; background:var(--sand-soft); color:var(--sand-ink); display:flex; align-items:center; justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/></svg>
      </div>
      <div style="flex:1; min-width:0;">
        <p style="margin:0 0 2px; font-size:15px; font-weight:600;">Cien años de soledad</p>
        <p style="margin:0 0 8px; font-size:12.5px; color:var(--text-soft);">Edición especial, tapa dura</p>
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:13px; font-weight:600;">$90.000</span>
          <span style="font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px; background:var(--pri-low-bg); color:var(--pri-low-ink);">Baja</span>
        </div>
      </div>
      <div style="width:32px; height:32px; flex:none; border-radius:50%; border:1.8px solid var(--border); color:var(--text-faint); display:flex; align-items:center; justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"/></svg>
      </div>
    </div>

    <div style="display:flex; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px;">
      <div style="width:56px; height:56px; flex:none; border-radius:14px; background:var(--accent2-soft); color:var(--accent2-ink); display:flex; align-items:center; justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4"/><path d="M4 12h16v9H4z"/><path d="M12 8v13"/><path d="M12 8H8a2.5 2.5 0 010-5C11 3 12 8 12 8z"/><path d="M12 8h4a2.5 2.5 0 000-5C9 3 12 8 12 8z"/></svg>
      </div>
      <div style="flex:1; min-width:0;">
        <p style="margin:0 0 2px; font-size:15px; font-weight:600;">Cita en el spa</p>
        <p style="margin:0 0 8px; font-size:12.5px; color:var(--text-soft);">Masaje de una hora</p>
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:13px; font-weight:600;">$130.000</span>
          <span style="font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px; background:var(--pri-high-bg); color:var(--pri-high-ink);">Alta</span>
        </div>
      </div>
      <div style="width:32px; height:32px; flex:none; border-radius:50%; border:1.8px solid var(--border); color:var(--text-faint); display:flex; align-items:center; justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"/></svg>
      </div>
    </div>

  </div>

  <div style="position:absolute; left:0; right:0; bottom:0; height:78px; background:var(--surface); border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-around; padding-bottom:10px; box-sizing:border-box;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text-faint);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.5-9C1.3 8.4 2.4 5 5.8 5c2 0 3.3 1.1 4 2.3.7-1.2 2-2.3 4-2.3 3.4 0 4.5 3.4 3.3 6.5-2 4.4-9.5 9-9.5 9z"/></svg>
      <span style="font-size:11px; font-weight:500;">Mi lista</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--accent2-ink);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
      <span style="font-size:11px; font-weight:600;">Ana</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text-faint);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.9 6.4.6-4.8 4.4 1.4 6.3L12 17l-5.6 3.2 1.4-6.3L3 9.5l6.4-.6L12 3z"/></svg>
      <span style="font-size:11px; font-weight:500;">Sofía</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
